# =============================================================================
#  在 GitHub 的 Linux runner 上构建安卓 APK（跑在 Ubuntu 22.04 容器里）
# =============================================================================
#
#  为什么放云端：Buildozer 只能在 Linux 上跑，而国内网络下 Android SDK/NDK
#  （好几个 GB）和 python-for-android 基本下不动。GitHub 的 runner 在国外，
#  这些都能正常下 —— 你只管推代码，回来拿 APK。
#
#  ★ 为什么要套一层容器（container: ubuntu:22.04）：
#    p4a 的那堆老配方在 Ubuntu 24.04 上会被新版 autoconf 判死：
#      configure.ac:215: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
#      autoreconf: error: /usr/bin/autoconf failed with exit status: 1
#    而 runs-on 指定 ubuntu-22.04 现在已经不生效了（GitHub 只给 24.04）。
#    所以干脆用容器把系统钉死在 22.04 —— 这样跟 p4a 的测试环境一致，
#    顺便也把 Python 3.10 一起钉住了（22.04 自带的 python3 就是 3.10）。
#
#  用法：
#    1. 推到 GitHub 仓库
#    2. Actions 标签里看构建；首次 30~60 分钟，之后有缓存 10 分钟左右
#    3. 跑完在 Artifacts 里下载 ballgame-apk
#    4. 失败了也不要紧：日志会自动写进仓库的 build-error.md
# =============================================================================

name: 构建 APK

on:
  workflow_dispatch:          # 也可以在 Actions 页面手动点一下触发
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04   # ★ 系统钉死在 22.04，见文件头
    timeout-minutes: 150

    # 失败时要把日志写回仓库，所以要写权限
    permissions:
      contents: write

    steps:
      # 容器里没有 git，而 actions/checkout 需要它 —— 必须先装
      - name: 容器里先装 git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 装系统依赖
        run: |
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev \
            gettext autopoint m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      # SDK + NDK 加起来好几个 GB，缓存住能给后续每次构建省掉十几分钟
      - name: 缓存 Buildozer 的 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          # cython 必须 < 3.0，3.x 移除了 p4a recipe 依赖的 longintrepr.h
          python3 -m pip install buildozer "cython==0.29.36"

      - name: 构建 debug APK
        id: build
        continue-on-error: true      # 失败了也要往下走，好把日志存下来
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee /tmp/bz.log

      # 构建日志默认只有仓库管理员能看（API 匿名读不到）。
      # 所以失败时把关键部分写回仓库一个文件，这样谁都能通过公开 API 读到 —— 方便排查。
      - name: 失败时把日志写回仓库
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# 构建失败日志（自动生成，排查用）"
            echo ""
            echo "运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 失败前的 300 行（能看出在编译哪个库）"
            echo '```'
            grep -n "" /tmp/bz.log | tail -300
            echo '```'
            echo ""
            echo "## 所有报错行"
            echo '```'
            grep -n -i -B 3 -A 12 'error\|Traceback\|STDERR\|command not found' /tmp/bz.log | head -200
            echo '```'
          } > build-error.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-error.md
          # [skip ci] 很重要：不然这次提交又会触发一轮构建，无限循环
          git commit -m "记录构建失败日志 [skip ci]" || true
          git push

      - name: 构建失败就报错退出
        if: steps.build.outcome == 'failure'
        run: |
          echo "构建失败了，日志见 build-error.md"
          exit 1

      - name: 上传 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ballgame-apk
          path: bin/*.apk
          if-no-files-found: error
