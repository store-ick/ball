# =============================================================================
#  在 GitHub 的 Linux runner 上构建安卓 APK（跑在 Ubuntu 22.04 容器里）
# =============================================================================
#
#  为什么放云端：Buildozer 只能在 Linux 上跑，而国内网络下 Android SDK/NDK
#  （好几个 GB）和 python-for-android 基本下不动。GitHub 的 runner 在国外，
#  这些都能正常下 —— 你只管推代码，回来拿 APK。
#
#  ★ 为什么要套一层容器（container: ubuntu:22.04）：
#    p4a 的那堆老配方在 Ubuntu 24.04 上会被新版 autoconf 判死：
#      configure.ac:215: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
#      autoreconf: error: /usr/bin/autoconf failed with exit status: 1
#    而 runs-on 指定 ubuntu-22.04 现在已经不生效了（GitHub 只给 24.04）。
#    所以干脆用容器把系统钉死在 22.04 —— 这样跟 p4a 的测试环境一致，
#    顺便也把 Python 3.10 一起钉住了（22.04 自带的 python3 就是 3.10）。
#
#  用法：
#    1. 推到 GitHub 仓库
#    2. Actions 标签里看构建；首次 30~60 分钟，之后有缓存 10 分钟左右
#    3. 跑完在 Artifacts 里下载 ballgame-apk
#    4. 失败了也不要紧：日志会自动写进仓库的 build-error.md
# =============================================================================

name: 构建 APK

on:
  workflow_dispatch:          # 也可以在 Actions 页面手动点一下触发
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04   # ★ 系统钉死在 22.04，见文件头
    timeout-minutes: 150

    # 失败时要把日志发成 Issue，所以需要 issue 写权限
    permissions:
      contents: write
      issues: write

    steps:
      # 容器里没有 git，而 actions/checkout 需要它 —— 必须先装
      - name: 容器里先装 git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 装系统依赖
        run: |
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev \
            gettext autopoint m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      # SDK + NDK 加起来好几个 GB，缓存住能给后续每次构建省掉十几分钟
      - name: 缓存 Buildozer 的 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          # cython 必须 < 3.0，3.x 移除了 p4a recipe 依赖的 longintrepr.h
          python3 -m pip install buildozer "cython==0.29.36"

      - name: 构建 debug APK
        id: build
        continue-on-error: true      # 失败了也要往下走，好把日志存下来
        shell: bash                  # ★ 容器里默认是 dash，不支持 pipefail，必须显式要 bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee /tmp/bz.log

      # 构建日志默认只有仓库管理员能看（API 匿名读不到）。
      # 所以失败时把关键部分发成一条 Issue —— Issue 是公开可读的，谁都能拿 API 看。
      # （原来用"提交回仓库"的办法，但容器里 git 拿不到推权限，改成发 Issue 更稳。）
      - name: 失败时把日志发成 Issue
        if: steps.build.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "构建失败：$RUN_URL"
            echo ""
            echo "## 失败前的 400 行（能看出在编译哪个库）"
            echo '```'
            tail -400 /tmp/bz.log 2>/dev/null || echo "(日志文件没生成 —— 说明失败得很早)"
            echo '```'
          } > /tmp/body.md
          python3 - <<'PY'
import json, os, urllib.request, urllib.error
body = open("/tmp/body.md", encoding="utf-8", errors="replace").read()
if len(body) > 60000:
    body = body[:60000] + "\n...(太长，已截断)"
title = "构建失败日志"
payload = json.dumps({"title": title, "body": body}).encode()
req = urllib.request.Request(
    "https://api.github.com/repos/%s/issues" % os.environ["REPO"],
    data=payload,
    headers={"Authorization": "token " + os.environ["GH_TOKEN"],
             "Accept": "application/vnd.github+json",
             "Content-Type": "application/json"},
)
try:
    r = urllib.request.urlopen(req)
    print("Issue 已创建，状态码:", r.status)
except Exception as e:
    print("创建 Issue 失败:", e)
    print(body[:3000])
PY

      - name: 构建失败就报错退出
        if: steps.build.outcome == 'failure'
        run: |
          echo "构建失败了，日志见 build-error.md"
          exit 1

      - name: 上传 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ballgame-apk
          path: bin/*.apk
          if-no-files-found: error
