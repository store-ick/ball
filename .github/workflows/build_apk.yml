# =============================================================================
#  在 GitHub 的 Linux runner 上构建安卓 APK（跑在 Ubuntu 22.04 容器里）
# =============================================================================
#
#  为什么放云端：Buildozer 只能在 Linux 上跑，而国内网络下 Android SDK/NDK
#  （好几个 GB）和 python-for-android 基本下不动。GitHub 的 runner 在国外，
#  这些都能正常下 —— 你只管推代码，回来拿 APK。
#
#  ★ 为什么要套一层容器（container: ubuntu:22.04）：
#    p4a 的那堆老配方在 Ubuntu 24.04 上会被新版 autoconf 判死：
#      configure.ac:215: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
#      autoreconf: error: /usr/bin/autoconf failed with exit status: 1
#    而 runs-on 指定 ubuntu-22.04 现在已经不生效（GitHub 只给 24.04）。
#    所以用容器把系统钉死在 22.04 —— 跟 p4a 的测试环境一致，
#    顺便把 Python 也钉在 3.10（22.04 自带的 python3 就是 3.10）。
#
#  ★ 容器里默认的 shell 是 dash，不是 bash！
#    所以 `set -o pipefail` 这类 bash 语法会直接报 "Illegal option" 退出。
#    需要 bash 的步骤要显式写 `shell: bash`。
#
#  用法：
#    推到 GitHub → Actions 里看 → 跑完在 Artifacts 下载 ballgame-apk
#    首次 30~60 分钟（要下 2GB NDK + 编译整个 Python），之后有缓存 10 分钟左右
# =============================================================================

name: 构建 APK

on:
  workflow_dispatch:          # 也可以在 Actions 页面手动点一下触发
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04   # ★ 系统钉死在 22.04，见文件头
    timeout-minutes: 150

    steps:
      # 容器里没有 git，而 actions/checkout 需要它 —— 必须先装
      - name: 容器里先装 git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 装系统依赖
        run: |
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev \
            gettext autopoint m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      # SDK + NDK 加起来好几个 GB，缓存住能给后续每次构建省掉十几分钟
      - name: 缓存 Buildozer 的 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          # cython 必须 < 3.0，3.x 移除了 p4a recipe 依赖的 longintrepr.h
          python3 -m pip install buildozer "cython==0.29.36"

      # 排错用：把关键环境信息打出来。构建失败时把这一步的输出发我即可。
      - name: 环境自检（失败时把这段发给开发者）
        run: |
          echo "===== pwd ====="
          pwd
          echo "===== 当前目录内容 ====="
          ls -la
          echo "===== 仓库根在哪 ====="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" | head -30
          echo "===== buildozer.spec 在不在 ====="
          ls -l buildozer.spec 2>&1 || echo "!! 当前目录没有 buildozer.spec"
          ls -l "$GITHUB_WORKSPACE/buildozer.spec" 2>&1 || echo "!! 仓库根也没有 buildozer.spec"
          echo "===== buildozer 装在哪 ====="
          command -v buildozer || echo "!! PATH 里找不到 buildozer"
          python3 -m pip show buildozer 2>&1 | head -5
          echo "===== PATH ====="
          echo "$PATH"
          echo "===== python3 ====="
          python3 --version
          which python3

      - name: 构建 debug APK
        run: buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ballgame-apk
          path: bin/*.apk
          if-no-files-found: error
