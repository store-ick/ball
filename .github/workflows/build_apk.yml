# =============================================================================
#  在 GitHub 的 Linux runner 上构建安卓 APK
# =============================================================================
#  为什么放云端：Buildozer 只能在 Linux 上跑，而国内网络下 Android SDK/NDK
#  （好几个 GB）和 python-for-android 基本下不动。GitHub 的 runner 在国外，
#  这些都能正常下 —— 你只管推代码，回来拿 APK。
#
#  用法：
#    1. 推到 GitHub 仓库
#    2. 打开仓库的 Actions 标签，能看到这次构建
#    3. 首次大概 30~60 分钟（要下 NDK 并编译整个 Python）
#       之后有缓存，10 分钟左右
#    4. 跑完在页面下方的 Artifacts 里下载 ballgame-apk
# =============================================================================

name: 构建 APK

on:
  workflow_dispatch:          # 也可以在 Actions 页面手动点一下触发
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 首次构建很久，别让默认超时把任务掐了

    steps:
      - uses: actions/checkout@v4

      # JDK 必须 17：21 会和 Android SDK 的构建工具冲突
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      # SDK + NDK 加起来好几 GB，缓存住能给后续每次构建省掉十几分钟
      - name: 缓存 Buildozer 的 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 装 buildozer
        run: |
          python -m pip install --upgrade pip
          # cython 必须 < 3.0，3.x 移除了 p4a recipe 依赖的 longintrepr.h
          pip install buildozer "cython==0.29.36"

      - name: 构建 debug APK
        run: buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ballgame-apk
          path: bin/*.apk
          if-no-files-found: error
