# =============================================================================
#  弹球 · 大数   —— 关卡配置
# =============================================================================
#
#  写几个 [[panel]] 就有几屏：
#      1 个  ->  单屏
#      2 个  ->  左右分屏，中间一条竖线，谁先掉到最底下谁赢
#      3 个  ->  三屏并排，同样谁先到底谁赢
#
#  ★ 每一屏用哪个球，有三种写法：
#      1) 什么都不写        -> 开局弹选球界面，从 balls.toml 里挑（推荐）
#      2) ball = "加一球"   -> 写死用球库里的这颗，这一屏不参与选择
#      3) [panel.ball] ...  -> 就地把球写在这，也不参与选择（老写法，仍然兼容）
#
#  球库在 [global] 的 balls_file 指定的文件里（默认 balls.toml，和本文件同目录）。
#  想加新球就去 balls.toml 复制一段 [[ball]]，选球界面里就多一个选项。
#
#  ★ 想只玩一个球（切成单屏）：在不想玩的那一屏里加一行  enabled = false
#
#  每屏的横杠数量由 [global] 的 bar_count 统一决定，左右共用同一个数，
#  所以各屏的行位置永远对得齐。bars 里第 i 个值落在第 i 行（从上面数）。
#
#  数字的写法：
#      45           整数
#      1.6e9        浮点
#      "1E10000"    超出 float 范围（约 1.8E308）的必须写成字符串
#
# =============================================================================

[global]
gravity       = 1800.0   # 重力加速度（像素/秒²），球的能力可以改它的倍率
panel_width   = 470      # 单个面板宽度（只是在算窗口初始大小的时候用）
panel_height  = 900      # 窗口高度（同上，拖大拖小之后以实际窗口为准）
divider_width = 6        # 分屏时中间竖线的宽度
header_height = 150      # 顶部留给"球名 / 描述 / 伤害"的高度
bar_height    = 20       # 横杠厚度
ball_radius   = 18       # 球的半径
fps           = 60
full_digit_limit = 10    # 十进制位数 < 它就完整显示，否则写科学计数法（1E10）

# ★ 窗口可以拖大拖小。拖动之后：各屏宽度平均分、横杠重新铺到各自的行上、
#   球按比例挪过去。想固定窗口大小就写 resizable = false。
resizable     = true
header_ratio  = 0.35     # 顶部信息区最多占屏高多少（窗口压得很扁时按比例收）

# ★ 物理效果随窗口缩放。开着的话：重力 / 反弹力度乘「面板高 ÷ panel_height」，
#   横向速度乘「面板宽 ÷ panel_width」。效果是弹跳高度占层间距的比例不变、
#   球从顶落到底的耗时也不变 —— 窗口拖多大手感都一样。
#   球的半径、横杠厚度、字体不缩放。想要"窗口变大球就显得弹得矮"的老行为，
#   就写 scale_physics = false。
scale_physics = true

# ★ 随机扰动：让各屏的球不要像镜像一样同步。
#   球出生时会给每个球掷一组"性格"（让反弹力度和横向速度在 ±这个比例内浮动），
#   之后整局固定 —— 所以两边各有各的节奏，但每个球自己还是干净的抛物线。
#   0    = 完全确定，两屏会长得一样（旧的对称效果）
#   0.15 = 轻微错开（默认）
#   0.4+ = 很疯
#   注意：出生掷一次，不是每次反弹都掷 —— 后者会让每个球自己抖得像卡顿。
randomness = 0.15

balls_file    = "balls.toml"   # 球库文件（相对本文件）。文件不存在就是空球库

# ★ 每一屏几根横杠。各屏共用这一个数，所以行位置必然对得齐。
#   哪一屏的 bars 写得比它少，就在底部自动补 default_bar_hp 这么大血量的横杠。
bar_count      = 5
default_bar_hp = 1


# ─────────────────────────────────────────────────────────────────────────────
#  左屏
# ─────────────────────────────────────────────────────────────────────────────
[[panel]]
enabled = true
bars = ["1E4", "1E9", "1E12", "1E120", "1E888"]
# 不写 ball -> 开局从球库里选


# ─────────────────────────────────────────────────────────────────────────────
#  右屏
# ─────────────────────────────────────────────────────────────────────────────
[[panel]]
enabled = true
bars = [10, 10, 10, 10, 10]
# 想给这一屏写死一颗球，就把下面这行的注释去掉（写死后这屏就不参与选球了）：
# ball = "1球"
